          // Two of these are already written into the scenario's .aiignore;
          // the rest are what the Files page offers as one-click rules.
          suggestedAiignore: ['dist/', 'package-lock.json', '*.log', 'coverage/'],
          reads: [
            { path: 'src/index.js', relativePath: 'src/index.js', bytes: 24000 },
            { path: 'src/legacy.js', relativePath: 'src/legacy.js', bytes: 90000 }
          ],
          available: conversationRows.map((row) => ({ id: row.id, at: row.at || 1793190000000, cwd: row.cwd }))
        });
      }
      if (url.indexOf('/aiignore/client-report') === 0) return record({ received: true });
      if (url.indexOf('/aiignore/overview') === 0) {
        return record({
          current: '/Users/you/code/demo-noise',
          source: 'session',
          workspaces: [
            { path: '/Users/you/code/demo-noise', title: 'demo-noise', sessions: 3, healthScore: 22, effectiveScore: 62, suggested: 4, files: 8, bytes: 1572864, noisePercent: 78, noise: ['dist/', 'package-lock.json'] },
            { path: '/Users/you/code/other', title: 'other-project', sessions: 1, healthScore: 91, effectiveScore: 97, suggested: 0, files: 24, bytes: 204800, noisePercent: 9, noise: [] }
          ]
        });
      }
      if (url === '/aiignore/allow') return record({ allowed: true });
      if (url === '/aiignore/ignore') return record({ ignored: true, rule: String((body && body.path) || '') });
      if (url === '/aiignore/rules') return record({ rule: String((body && body.rule) || ''), added: 1, created: false });
      if (url === '/aiignore/unignore') return record({ removed: true });
      if (url === '/aiignore/notes') return record({ written: true, removed: false });
      const FACTORS = [0, 0, 0.15, 0.35, 0.55, 0.75, 0.9];
      if (url.indexOf('/aiignore/levels') === 0) {
        if (window.__failLevels === true) return record({ error: 'no' }, 500);
        const target = SCENARIOS[scenario];
        const raw = target && target.scanned ? target.scanned.healthScore : 22;
        return record({
          workspace: '/Users/you/code/demo-noise',
          level: window.__level ? window.__level.level : 3,
          levels: LEVELS.map((entry) => ({
            level: entry.level,
            label: entry.label,
            note: entry.note,
            maxBytes: entry.maxBytes,
            effectiveScore: Math.round(raw + (100 - raw) * (FACTORS[entry.level] || 0)),
            blockedFiles: entry.level === 1 ? 0 : Math.round(entry.level * 1.6),
            blockedBytes: entry.level === 1 ? 0 : entry.level * 380 * 1024
          }))
        });
      }
      if (url === '/aiignore/policy') {
        const next = Number((body && body.level) || 3);
        LEVELS.forEach((entry) => { if (entry.level === next) window.__level = entry; });
        // The real Host re-scans with the new strength, so the score moves.
        const target = SCENARIOS[scenario];
        if (target && target.scanned) {
          const raw = target.scanned.healthScore;
          const factor = FACTORS[next] || 0;
          target.scanned.effectiveScore = Math.round(raw + (100 - raw) * factor);
          target.scanned.effectiveBreakdown = target.scanned.scoreBreakdown.map((row) => ({
            ...row,
            lost: Math.round(row.lost * (1 - factor) * 10) / 10
          }));
          target.scanned.effectiveLost = Math.round(
            target.scanned.effectiveBreakdown.reduce((sum, row) => sum + row.lost, 0) * 10
          ) / 10;
          target.scanned.level = next;
        }
        return record({ level: next, levels: LEVELS, policy: 'deny' });
      }
      if (url === '/aiignore/rules/delete') {
        let rule = '';
        try {
          rule = JSON.parse((init && init.body) || '{}').rule || '';
        } catch {}
        const list = Array.isArray(data.rules) ? data.rules : (data.rules = []);
        const at = list.indexOf(rule);
        if (at < 0) return record({ error: 'no-such-rule' }, 404);
        list.splice(at, 1);
        return slow({ removed: true, rule });
      }
      if (url === '/aiignore/optimize') {
        // Real hosts take a few hundred ms; the step list is only meaningful if
        // the answer is not instantaneous.
        const delay = window.__optimizeDelay === undefined ? 900 : window.__optimizeDelay;
        const asked = body === null || body === undefined ? {} : body;
        if (typeof asked.session === 'string') {
          const row = conversationRows.find((entry) => entry.id === asked.session);
          if (row !== undefined) {
            row.covered = row.noise;
            row.noise = 0;
            row.effectiveScore = 100;
          }
        }

        // The Host reports the effective score on both sides: rules change what
        // still reaches the model, not how noisy the folder is.
        const named = body && typeof body.cwd === 'string' ? body.cwd : null;
        const before = (window.__lastReport && window.__lastReport.scanned.effectiveScore) || 0;
        const target = SCENARIOS[scenario];
        if (target && target.scanned) {
          target.scanned.effectiveScore = Math.min(100, before + 6);
          target.scanned.suggestedAiignore = [];
          delete target.scanned.effectiveBreakdown;
          window.__lastReport = null;
        }
        return slow({
          workspace: named || '/Users/you/code/demo-noise',
          added: ['dist/', 'package-lock.json'],
          written: true,
          before: before,
          after: Math.min(100, before + 6),
          saved: ['dist/', 'package-lock.json'],
          blockedNow: [
            { path: 'dist/bundle.js', blocked: true },
            { path: 'package-lock.json', blocked: true }
          ],
          covered: [
            { path: 'dist/bundle.js', bytes: 146000, reason: 'generated build output' },
            { path: 'package-lock.json', bytes: 30000, reason: 'lockfile' }
          ],
          report: window.__lastReport === null
            ? null
            : Object.assign({}, window.__lastReport, {
                scanned: Object.assign({}, window.__lastReport.scanned, {
                  effectiveScore: Math.min(100, before + 6),
                  suggestedAiignore: []
                })
              })
        }, undefined, delay);
      }
      if (url === '/aiignore/optimize/undo') return record({ undone: true, restored: 'previous' });
      return record({ error: 'unknown route' }, 404);
    };

    // ---- mock host: services, slots, locale -----------------------------
    const dicts = {};
    let bound = null;
    let language = 'en';

    const slots = {
      inject: function (name, register) { register(); },
      register: function (definition, component) {
        const mount = function (id, path) {
          const root = document.getElementById(id);
          if (root === null) return;
          // `?nocwd=1` drops the session props, which is exactly the state the
          // real Host put the panel in — the picker has to carry it from there.
          const props = location.search.indexOf('nocwd') !== -1
            ? {}
            : {
                sessionId: 'preview-session',
                useSessions: function (select) {
                  return select({ byId: { 'preview-session': { cwd: '/Users/you/code/demo-noise' } } });
                }
              };
          window.ReactLite.render(window.ReactLite.createElement(component, props), root, path);
        };
        if (definition.name === 'sidebar.right.pane.tab') mount('panel-root', 'panel');
        if (definition.name === 'main') {
          // The left-rail overview opens here in the real app; the preview gives
          // it the whole conversation column so its layout can be judged.
          const stage = document.getElementById('stage-root');
          if (stage !== null) {
            const props = { t: function (key) { return key; } };
            window.ReactLite.render(window.ReactLite.createElement(component, props), stage, 'stage');
          }
        }
        if (definition.name === 'sidebar.panellist') {
          const rail = document.getElementById('rail-root');
          if (rail !== null) {
            window.ReactLite.render(window.ReactLite.createElement(component, null), rail, 'rail');
          }
        }
        if (definition.name === 'conversation.input.left') mount('composer-root', 'composer');
        if (definition.name === 'sidebar.right.pane.tab.title') {
          const root = document.getElementById('chip-root');
          if (root !== null) {
            window.ReactLite.render(window.ReactLite.createElement(component, null), root, 'chip');
          }
        }
        return function () {};
      }
    };

    const hostCtx = {
      locale: {
        register: function (ns, dict) { dicts[ns] = dict; },
        bind: function (ns) {
          return function (key) {
            const dict = dicts[ns] || {};
            const table = dict[language] || dict.en || {};
            return table[key] === undefined ? key : table[key];
          };
        }
      },
      slots: slots,
      sidebarRightTabs: { register: function () { return function () {}; } },
      sidebarRight: location.search.indexOf('nosidebar') !== -1
        ? undefined
        : { openTab: function () { /* the pane is already mounted */ } },
      inject: function (deps, callback) {
        if (location.search.indexOf('nosidebar') !== -1 && deps.indexOf('sidebarRight') !== -1) return;
        callback({
          slots: slots,
          sidebarRightTabs: hostCtx.sidebarRightTabs,
          sidebarRight: hostCtx.sidebarRight,
          effect: function (run) { run(); return function () {}; }
        });
      },
      effect: function (run) { return run(); }
    };

    // ---- load the real plugin ------------------------------------------
    window.__ModuleLoader__ = {
      load: function (definition) {
        const panel = definition.factory(function (name) {
          if (name === 'react') return window.ReactLite;
          throw new Error('preview has no module ' + name);
        });
        panel.apply(hostCtx);
        window.__panel = panel;
      }
    };
  </script>
  <script src="../client.js"></script>
  <script>
    // ---- controls -------------------------------------------------------
    document.querySelectorAll('[data-scenario]').forEach(function (button) {
      button.addEventListener('click', function () {
        scenario = button.getAttribute('data-scenario');
        document.querySelectorAll('[data-scenario]').forEach(function (other) {
          other.setAttribute('aria-pressed', other === button ? 'true' : 'false');
        });
        window.ReactLite.rerender();
      });
    });

    document.getElementById('theme').addEventListener('click', function () {
      const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      this.textContent = dark ? 'light' : 'dark';
    });

    // Failure switches as URL flags, so the three states can be opened cold
    // (a state that only appears after a retry hides the first impression).
    if (location.search.indexOf('failconv') !== -1) window.__failConversations = true;
    if (location.search.indexOf('faillevels') !== -1) window.__failLevels = true;
    if (location.search.indexOf('failreport') !== -1) window.__failReport = true;

    window.__preview = {
      scenario: function (name) {
        scenario = name;
        document.querySelectorAll('[data-scenario]').forEach(function (button) {
          button.setAttribute('aria-pressed', button.getAttribute('data-scenario') === name ? 'true' : 'false');
        });
        window.ReactLite.rerender();
      },
      tab: function (index) {
        const tabs = document.querySelectorAll('.aicd-tab');
        if (tabs[index]) tabs[index].click();
      },
      theme: function (name) {
        document.documentElement.setAttribute('data-theme', name);
        document.getElementById('theme').textContent = name === 'dark' ? 'light' : 'dark';
      },
      row: function (path) {
        const rows = Array.prototype.slice.call(document.querySelectorAll('.aicd-row'));
        const hit = rows.find(function (row) { return row.textContent.indexOf(path) !== -1; });
        if (hit) hit.click();
      },
      calls: calls
    };

    window.__calls = calls;
  </script>
</body>
